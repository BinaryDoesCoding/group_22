build_src_filter =
    +<*> -<HC-SR04> -<Rangefinder> -<Sharp-IR>
test_filter = 
    test_native/test_lowpass_filter

[env:romi]
platform = atmelavr
board = a-star32U4
framework = arduino

lib_deps =
    https://github.com/WPIRoboticsEngineering/Romi-32u4-utilities

[env:HC-SR04-raw-demo]
extends = env:romi
build_src_filter = 
    +<*>
    +<../examples/HC-SR04-raw-demo>

[env:HC-SR04-filter-demo]
extends = env:romi
build_src_filter = 
    +<*>
    +<../examples/HC-SR04-filter-demo>
   
[env:Sharp-IR-demo]
extends = env:romi
build_src_filter = 
    +<*>
    +<../examples/Sharp-IR-demo>
   