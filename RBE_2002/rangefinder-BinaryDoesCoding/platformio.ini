; for unit testing independent of hardware
[env:median-filter-test]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<*> -<HC-SR04> -<Rangefinder> -<Sharp-IR>
test_filter = 
    test_native/test_median_filter

[env:moving-avg-filter-test]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<*> -<HC-SR04> -<Rangefinder> -<Sharp-IR>
test_filter = 
    test_native/test_moving_avg_filter

[env:lowpass-filter-test]
platform = native
