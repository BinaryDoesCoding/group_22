; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; native is used for unit testing independent of hardware
[env:intersection-test]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<*>
    +<LineSensor>
test_filter = 
    test_native

; the romi enviroment is for unit testing on hardware
[env:romi]
platform = atmelavr
board = leonardo
framework = arduino
test_build_src = true

monitor_speed = 115200

; the examples are used to run functional tests on hardware
[env:intersection-demo]
extends = env:romi
build_src_filter =
  +<*>
  +<../examples/intersection-demo/src/*>

[env:lining-demo]
extends = env:romi
build_src_filter =
  +<*>
  +<../examples/line-following-demo/src/*>
